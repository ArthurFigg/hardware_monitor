[project]
name = "hardware-monitor"
version = "2.1.0"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2,<6.0.0",
    "pillow>=12.3.0,<13.0.0",
    "plyer>=2.1.0,<3.0.0",
    "psutil>=7.2.2,<8.0.0",
    "pystray>=0.19.5,<0.20.0",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2,<7.0.0",
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.16.4,<0.17.0",
]

[tool.uv]
# O projeto vive dentro do OneDrive. O modo hardlink padrão faz o venv e o cache
# do uv compartilharem o mesmo registro de arquivo; quando o OneDrive dehidrata o
# lado do venv, o cache é corrompido junto (os error 396). Copiar evita isso.
link-mode = "copy"
