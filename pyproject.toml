requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "plyer>=2.1.0",
    "psutil>=7.2.2",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
